<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TMT OFFICIAL Admin</title>

<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/responsive.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="layout">

    <aside id="sidebar-slot"></aside>

    <div class="main">

        <header id="navbar-slot"></header>

        <main id="content">
            <div class="loading-screen">Loading Dashboard...</div>
        </main>

    </div>

</div>

<script type="module">
import { guardPage } from "./js/auth.js";
import { initShell } from "./js/sidebar.js";
import { startRouter } from "./js/dashboard.js";

const loading = document.querySelector(".loading-screen");

(async () => {
  try {
    loading.textContent = "Step 1: guardPage";
    await guardPage();

    loading.textContent = "Step 2: initShell";
    await initShell();

    loading.textContent = "Step 3: startRouter";
    startRouter();

    loading.textContent = "Dashboard Loaded";
  } catch (e) {
    document.body.innerHTML =
      "<pre style='padding:20px;color:#ff5555;white-space:pre-wrap'>" +
      (e.stack || e.message || e) +
      "</pre>";
  }
})();
</script>
</body>
</html>
